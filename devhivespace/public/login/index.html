<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../login/styles/login.css" rel="stylesheet" />
    <script src="../login/scripts/login.js"></script>
    <title>DevHive Space - Login</title>
  </head>
  <body>
    <div class="container">
      <div class="login-section">
        <div class="logo">
          <div class="logo-icon">
            <img src="../assets/devhive_logo.png" alt="DevHive Space" />
          </div>
          <div class="logo-text">DevHive Space</div>
        </div>

        <h1 class="welcome-title">Welcome to your content Hive</h1>
        <p class="welcome-subtitle">
          Log in to start posting everywhere at once and expand your digital
          reach.
        </p>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="Your work email"
              required />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="••••••••••••"
              required />
          </div>

          <div class="remember-row">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" />
              <label for="remember">Remember me</label>
            </div>
            <a href="./forget_pass.html" class="forgot-link">
              Forgot Password?</a
            >
          </div>

          <button type="submit" class="login-btn">Access Your Hive</button>

          <div class="oauth-buttons inline-oauth">
            <button
              type="button"
              class="oauth-circle hershive-btn"
              onclick="window.location.href='/api/auth/get_token.php?application_name=HersHive&redirect_url=https://hershive.com/oauth/callback'">
              <img src="../assets/hershive_logo.png" alt="HersHive Logo" class="oauth-logo" />
            </button>
            <button
              type="button"
              class="oauth-circle heybleepi-btn"
              onclick="window.location.href='/api/oauth/oauth_login.php?provider=heybleepi'">
              <img src="../assets/heybleepi_logo.png" alt="HeyBleepi Logo" class="oauth-logo" />
            </button>
            <a href="#" class="oauth-circle google-btn">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo" class="oauth-logo" />
            </a>
          </div>
        </form>

        <div class="signup-section">
          <a href="/devhivespace/pages/sign_up/index.html" class="signup-link">
            <strong>New content creator?</strong><br />
            Sign up now and save hours on content distribution
          </a>
        </div>
      </div>

      <div class="image-section">
        <div class="floating-elements">
          <div class="floating-circle"></div>
          <div class="floating-circle"></div>
          <div class="floating-circle"></div>
        </div>
        <div class="image-placeholder">
          <img src="../assets/login_image.png" alt="DevHive Space" />
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Post - DevHive</title>
    <link rel="stylesheet" href="styles.css" />
    <link 
      href="https://fonts.googleapis.com/css2?family=Coda+Caption:wght@800&family=Inter:wght@400;500;600;700&display=swap" 
      rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <div class="left-section">
        <aside class="sidebar">
          <div class="menu-item">
            <a href="../dashboard/index.html">
              <img src="../assets/DASHBOARD.png" alt="">
              <span>Dashboard</span>
            </a>
          </div>
          <div class="menu-item">
            <a href="../global_wall/index.html">
              <img src="../assets/global_feed.png" alt="">
              <span>Global Wall</span>
            </a>
          </div>
          <div class="menu-item">
            <a href="../user_profile/index.html">
              <img src="../assets/human.png" alt="">
              <span>Profile</span>
            </a>
          </div>
          <div class="menu-item active">
            <a href="../create_post/index.html">
              <img src="../assets/create_post.png" alt="">
              <span>Create Post</span>
            </a>
          </div>
          <div class="menu-item">
            <a href="../connected_accounts/index.html">
              <img src="../assets/link.png" alt="">
              <span>Connected Accounts</span>
            </a>
          </div>
          <div class="menu-item">
            <a href="../setting/index.html">
              <img src="../assets/settings.png" alt="">
              <span>Settings</span>
            </a>
          </div>
        </aside>
      </div>
      
      <div class="right-section">
        <h1 class="page-title">Create Post</h1>

        <main class="main-content">
          <form id="post-form">
            <div class="form-group">
              <label class="form-label">Post to:</label>
              <div class="platform-buttons">
                <button type="button" class="platform-btn active" data-platform="all">All</button>
                <button type="button" class="platform-btn" data-platform="heybeepi">Heybeepi</button>
                <button type="button" class="platform-btn" data-platform="hershive">Hershive</button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="post-content">Caption:</label>
              <textarea id="post-content" class="content-textarea" placeholder="What's on your mind?"></textarea>

              <div class="toolbar">
                <button type="button" id="image-upload-btn" class="toolbar-btn" title="Upload Image">
                  🖼️
                </button>
                <button type="button" id="video-upload-btn" class="toolbar-btn" title="Upload Video">
                  🎥
                </button>
              </div>

              <div id="image-previews" class="media-previews"></div>
              <div id="video-previews" class="media-previews"></div>
            </div>

            <div class="action-buttons">
              <button type="button" class="btn btn-secondary" id="preview-btn">Preview</button>
              <button type="button" class="btn btn-primary" id="share-post-btn">Share Post</button>
            </div>
          </form>
        </main>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

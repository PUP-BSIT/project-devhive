<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../login/styles/login.css" rel="stylesheet" />
    <script src="../login/scripts/login.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Coda+Caption:wght@800&family=Inter:wght@400;500;600;700&display=swap" 
          rel="stylesheet">
    <title>DevHive Space - Login</title>
  </head>
  <body>
    <div class="container">
      <div class="login-section">
        <h1 class="welcome-title">Welcome to your content Hive</h1>
        <p class="welcome-subtitle">
          Log in to start posting everywhere at once and expand your digital
          reach.
        </p>

        <form id="loginForm">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="Your work email"
              required />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="••••••••"
              required />
          </div>

          <div class="remember-row">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="remember" />
              <label for="remember">Remember me</label>
            </div>
            <a href="./forget_pass.html" class="forgot-link">
              Forgot Password?</a
            >
          </div>

          <button type="submit" class="login-btn">Access Your Hive</button>
        </form>

        <div class="divider">
          <p>Or log in with</p>
        </div>

        <div class="social-buttons">
          <a href="#" class="social-btn google-btn">Continue with Google</a>
        </div>

        <div class="signup-section">
          <strong>New content creator?</strong><br />
          <a href="/devhivespace/pages/sign_up/index.html" class="signup-link">
            Sign up now and save hours on content distribution</a
          >
        </div>
      </div>

      <div class="image-section">
        <div class="floating-elements">
          <div class="floating-circle"></div>
          <div class="floating-circle"></div>
          <div class="floating-circle"></div>
        </div>
        <div class="image-placeholder">
          <img src="../assets/login_image.png" alt="DevHive Space" />
        </div>
      </div>
    </div>
  </body>
</html>

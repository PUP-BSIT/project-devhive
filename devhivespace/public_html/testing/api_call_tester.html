<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevHive API Call Tester</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f7fafc; margin: 0; }
    .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px #0001; padding: 32px; }
    .label { font-weight: bold; }
    .input, textarea { width: 100%; margin-bottom: 12px; padding: 8px; border-radius: 4px; border: 1px solid #ddd; }
    .btn { background: #3182ce; color: #fff; border: none; border-radius: 6px; padding: 10px 20px; font-size: 1em; cursor: pointer; }
    .result { font-family: monospace; background: #f1f5f9; border-radius: 6px; padding: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>API Call Tester</h2>
    <div class="label">Endpoint URL</div>
    <input class="input" id="endpoint" value="/api/oauth/userinfo.php">
    <div class="label">Bearer Token</div>
    <input class="input" id="token" placeholder="Paste access token here">
    <div class="label">Fields (optional)</div>
    <input class="input" id="fields" placeholder="username,email,profile_picture">
    <button class="btn" id="callBtn">Call API</button>
    <div class="result" id="result"></div>
  </div>
  <script>
    document.getElementById('callBtn').onclick = function() {
      const endpoint = document.getElementById('endpoint').value;
      const token = document.getElementById('token').value;
      const fields = document.getElementById('fields').value;
      let url = endpoint;
      if (fields) url += '?fields=' + encodeURIComponent(fields);
      fetch(url, {
        headers: { 'Authorization': 'Bearer ' + token }
      })
      .then(r => r.text())
      .then(txt => {
        document.getElementById('result').textContent = txt;
      })
      .catch(e => {
        document.getElementById('result').textContent = 'Error: ' + e;
      });
    };
  </script>
</body>
</html>

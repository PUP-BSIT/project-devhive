<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email - DevHive Space</title>
    <!-- Favicon Configuration -->
    <link rel="shortcut icon" type="image/x-icon" href="../assets/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon_io/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon_io/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-TileColor" content="#ffffff">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/email_verify.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="../assets/locked.png" alt="Lock Icon" class="lock-icon" />
        <h1>Verify Your Email</h1>
        <p>
          We've sent a verification link to your email address.<br />
          Please check your inbox and click the link to activate your account.
          <br /><br />
          <small>Didn't receive the email? Check your spam folder or request a new verification link.</small>
        </p>
        <button id="openEmailBtn" class="success">Open Email Client</button>
        <a href="../signup/index.html" class="back-link">← Back to signup</a>
      </div>
    </div>
    <script src="scripts/email_verify.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - DevHive Space</title>
    <!-- Favicon Configuration -->
    <link rel="shortcut icon" type="image/x-icon" href="../assets/favicon_io/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/favicon_io/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/favicon_io/android-chrome-512x512.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon_io/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon_io/apple-touch-icon.png">
    <link rel="manifest" href="../assets/favicon_io/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-TileColor" content="#ffffff">
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter&display=swap"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Coda+Caption&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style/sign_up.css" />
  </head>
  <body>
    <div class="container">
      <div class="right">
        <h1>Join DevHive Space</h1>
        <p>Fill out the form below to create your account</p>
        <form id="signup-form">
          <input
            type="email"
            name="email"
            placeholder="Your work email"
            required />
          <input
            type="text"
            name="username"
            placeholder="Choose a username"
            required />
          <div class="name-fields">
            <input
              type="text"
              name="first_name"
              placeholder="First name"
              required />
            <input type="text" name="middle_name" placeholder="Middle name" />
            <input
              type="text"
              name="last_name"
              placeholder="Last name"
              required />
          </div>
          <input type="date" name="birthday" placeholder="Birthday" required />
          <input
            type="password"
            name="password"
            placeholder="Create a secure password (8+ characters)"
            required />
          <input
            type="password"
            name="confirm_password"
            placeholder="Re-enter your password"
            required />
          <button type="submit">Create My Account</button>
        </form>
        
        <div class="login-link">
          Already have an account?
          <a href="../login/index.html">Log in</a>
        </div>
      </div>
    </div>
    
    <script src="scripts/sign_up.js"></script>
  </body>
</html>

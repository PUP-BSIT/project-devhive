<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log in with DevHive</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-container">
    <h1>Log in to DevHive</h1>
    <form id="loginForm" method="post" autocomplete="on">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <button type="submit" class="login-btn">Log in with DevHive</button>
      <div id="loginError" class="error-message" style="display:none;"></div>
    </form>
    <p class="oauth-footer">
      By logging in, you agree to the DevHive <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.
    </p>
  </div>
  <script src="oauth_login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Authorize Access - DevHive Space - copy</title>
    <link rel="stylesheet" href="/copy/pages/authorization_page/styles.css" />
  </head>
  <body>
    <div class="oauth-container">
      <h1>Authorize Application</h1>
      <p>
        <strong id="client_name"></strong>
        is requesting access to your DevHive Space account.
      </p>
      <div id="scope_section" style="display: none">
        <p>
          <strong>Requested permissions:</strong>
          <span id="scope"></span>
        </p>
      </div>
      <form id="consent_form" method="post">
        <input type="hidden" name="csrf_token" id="csrf_token" />
        <button type="submit" name="approve" value="1" class="approve-btn">
          Approve
        </button>
        <button type="submit" name="deny" value="1" class="deny-btn">
          Deny
        </button>
      </form>
      <p class="oauth-footer">
        You are logged in as user ID: <span id="user_id"></span>
      </p>
    </div>
    <script src="/copy/pages/authorization_page/script.js"></script>
  </body>
</html>

        <div class="main-content">
            <aside class="sidebar">
                <ul class="nav-menu">

    <div id="share-modal-overlay" class="share-modal-overlay" style="display:none;">

        <div class="share-original-preview">

            <form action="/api/posts/share-create-post.php" method="POST" id="share-form">
            <input type="hidden" name="share_post_id" value="">

            <button type="submit" value="hershive" name="share_to_other" class="share-btn-hershive active">Share to Hershive</button>
            <button type="submit" value="heybleepi" name="share_to_other" class="share-btn-heybleepi active">Share to Heybleepi</button>
            </form>
        </div>
        <button class="share-main-btn">Share to Devhive</button>
        </div>
    </div>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="../login/styles/login.css" rel="stylesheet" />
    <script src="../login/scripts/login.js"></script>
    <title>DevHive Space - Login</title>
  </head>
  <body>
    <div class="container">
      <button class="back-button" onclick="history.back()">←</button>
      
      <h1 class="welcome-title">Sign in</h1>
      <p class="welcome-subtitle">Enter your account details to access your Hive</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="Enter your email"
            required />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-input"
            placeholder="Enter your password"
            required />
        </div>

        <div class="remember-row">
          <div class="checkbox-wrapper">
            <input type="checkbox" id="remember" />
            <label for="remember">Remember me</label>
          </div>
          <a href="./forget_pass.html" class="forgot-link">
            Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Sign in</button>

        <div class="divider">
          <span>or</span>
        </div>

        <div class="oauth-buttons">
          <button
            type="button"
            class="oauth-circle hershive-btn"
            onclick="window.location.href='/api/auth/get_token.php?application_name=HersHive&redirect_url=https://hershive.com/oauth/callback'">
            <img src="../assets/hershive_logo.png" alt="HersHive Logo" class="oauth-logo" />
          </button>
          <button
            type="button"
            class="oauth-circle heybleepi-btn"
            onclick="window.location.href='/api/oauth/oauth_login.php?provider=heybleepi'">
            <img src="../assets/heybleepi_logo.png" alt="HeyBleepi Logo" class="oauth-logo" />
          </button>
        </div>

        <div class="signup-section">
          <a href="/devhivespace/pages/sign_up/index.html" class="signup-link">
            <p>New content creator?</p>
            <strong>Sign up now</strong>
          </a>
        </div>
      </form>
    </div>
  </body>
</html>
